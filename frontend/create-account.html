<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account | Gift App</title>
    <meta name="description" content="Create your Gift App account." />
    <!-- Linked (not JS-imported) so these load as real stylesheets that block first paint,
         avoiding a flash of unstyled content while the JS module graph loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <link rel="stylesheet" href="/src/styles/brand-theme.css" />
    <link rel="stylesheet" href="/src/styles/page-templates.css" />
    <!-- Hide custom elements until their JS defines them, avoiding a flash of unstyled
         <gift-*>/<cds-*> elements before they upgrade. -->
    <style>
      :not(:defined) {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="cds--white" data-carbon-theme="brand">
    <div class="page-auth">
      <gift-nav-header product-name="Gift App">
        <cds-header-nav menu-bar-label="Gift App navigation">
          <!--
          <cds-header-nav-item href="/">Gift App</cds-header-nav-item>
          <cds-header-nav-item href="/gifts">Gifts</cds-header-nav-item>
          <cds-header-nav-item href="/people">People</cds-header-nav-item>
          -->
        </cds-header-nav>
      </gift-nav-header>

    <gift-image-container>
      <main class="page-auth__main">
        <section class="page-auth__panel" aria-labelledby="create-account-heading">
                    <gift-brand></gift-brand>
          <header class="page-auth__intro">
            <h1 id="create-account-heading" class="cds--type-heading-05">Create account</h1>
            <p class="cds--type-body-01">Start your thoughtful gift-giving journey.</p>
          </header>

          <div id="create-account-form-container">
            <gift-create-account-form></gift-create-account-form>
          </div>
          <p class="cds--type-body-01">
            Already have an account?

            <cds-link href="/">Log in</cds-link>
          </p>
        </section>
      </main>
    </gift-image-container>

    </div>
    <script type="module" src="/src/index.js"></script>
    <script type="module" src="/src/create-account.js"></script>
  </body>
</html>
