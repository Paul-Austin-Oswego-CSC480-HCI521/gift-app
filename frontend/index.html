<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in | Gift App</title>
    <meta name="description" content="Log in to your Gift App account." />
    <!-- Linked (not JS-imported) so these load as real stylesheets that block first paint,
         avoiding a flash of unstyled content while the JS module graph loads. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/src/styles/fonts.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <link rel="stylesheet" href="/src/styles/brand-theme.css" />
    <link rel="stylesheet" href="/src/styles/page-templates.css" />
    <!-- Hide custom elements until their JS defines them, avoiding a flash of unstyled
         <gift-*>/<cds-*> elements before they upgrade. -->
    <style>
      :not(:defined) {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="cds--white" data-carbon-theme="brand">
    <div class="fill-height page-auth">
      <gift-nav-header product-name="Gift App">
        <cds-header-nav menu-bar-label="Gift App navigation">
        </cds-header-nav>
      </gift-nav-header>
      <gift-image-container>
        <main class="page-auth__main">
          <section class="page-auth__panel" aria-labelledby="login-heading">
            <gift-brand></gift-brand>
            <header class="page-auth__intro">
              <h1 id="login-heading" class="cds--type-heading-05">Welcome!</h1>
              <p class="cds--type-body-01">Log in for more thoughtful gift-giving.</p>
            </header>

            <div id="login-form-container">
              <gift-login-form></gift-login-form>
            </div>
            <p class="cds--type-body-01">
              New to Gift App?
              <cds-link id="create-account-link" href="./create-account.html">Create account</cds-link>
            </p>
          </section>
        </main>
      </gift-image-container>

    </div>
    <script type="module" src="/src/index.js"></script>
    <script type="module" src="/src/login.js"></script>
  </body>
</html>
